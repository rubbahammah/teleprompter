<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Teleprompter & Video Recorder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen overflow-hidden select-none">

  <!-- SETUP VIEW -->
  <div id="setupView" class="flex flex-col h-screen p-5 max-w-lg mx-auto">
    <header class="py-4 border-b border-slate-800 flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
        Video Teleprompter
      </h1>
      <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">Editor-Ready MP4</span>
    </header>

    <div id="downloadBanner" class="hidden mt-3 p-3 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center justify-between">
      <span id="downloadInfo" class="text-xs font-medium text-emerald-200">Recording ready!</span>
      <a id="downloadBtn" download="teleprompter-recording.mp4" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition">Save Video (.mp4)</a>
    </div>

    <div class="flex-1 flex flex-col mt-4 gap-3 overflow-hidden">
      <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Prompter Script</label>
      <textarea id="scriptInput" class="w-full flex-1 bg-slate-900 border border-slate-800 rounded-xl p-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-base leading-relaxed" placeholder="Type or paste your script here...">Welcome to your mobile teleprompter!

Paste your script here, set your scroll speed, and tap 'Launch Camera & Prompter'.

Your front camera displays behind the script so you maintain eye contact while recording.</textarea>

      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 space-y-4">
        <div>
          <div class="flex justify-between text-xs text-slate-400 mb-1">
            <span>Scroll Speed</span>
            <span id="speedDisplay" class="font-bold text-blue-400">2.0x</span>
          </div>
          <input type="range" id="speedSlider" min="0.5" max="6" step="0.5" value="2" class="w-full accent-blue-500 h-2 bg-slate-700 rounded-lg">
        </div>

        <div>
          <div class="flex justify-between text-xs text-slate-400 mb-1">
            <span>Font Size</span>
            <span id="fontDisplay" class="font-bold text-blue-400">24px</span>
          </div>
          <input type="range" id="fontSlider" min="16" max="44" step="2" value="24" class="w-full accent-blue-500 h-2 bg-slate-700 rounded-lg">
        </div>

        <div class="flex items-center justify-between pt-1">
          <span class="text-xs text-slate-400">Mirror Prompter (Physical Glass)</span>
          <input type="checkbox" id="mirrorToggle" class="w-4 h-4 accent-blue-600 rounded">
        </div>
      </div>
    </div>

    <button id="launchBtn" class="mt-4 w-full py-4 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-semibold rounded-xl text-lg shadow-lg shadow-blue-600/30 transition">
      Launch Camera & Prompter
    </button>
  </div>

  <!-- PROMPTER & RECORDING VIEW -->
  <div id="prompterView" class="hidden relative w-screen h-screen bg-black overflow-hidden">
    <!-- Camera Preview -->
    <video id="cameraPreview" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 z-0"></video>

    <!-- Prompter Overlay -->
    <div id="prompterScrollBox" class="no-scrollbar absolute inset-0 z-10 overflow-y-auto bg-black/45 px-6">
      <div class="h-[40vh]"></div>
      <p id="prompterContent" class="text-white font-medium text-center leading-relaxed tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.95)] max-w-xl mx-auto whitespace-pre-wrap"></p>
      <div class="h-[60vh]"></div>
    </div>

    <!-- Top Bar Controls -->
    <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-none">
      <button id="exitBtn" class="pointer-events-auto bg-slate-950/80 backdrop-blur text-white text-xs px-3 py-2 rounded-lg border border-slate-700">✕ Exit</button>

      <a id="topDownloadBtn" download="teleprompter-recording.mp4" class="hidden pointer-events-auto bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-lg">
        ⬇ Save MP4
      </a>

      <div id="recIndicator" class="hidden bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
        <span>REC</span>
        <span id="recTimer" class="font-mono">00:00</span>
      </div>
    </div>

    <!-- Floating Action Bar -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 bg-slate-950/90 backdrop-blur-md px-5 py-3 rounded-full border border-slate-700/80 shadow-2xl">
      <button id="playPauseBtn" class="p-3 rounded-full bg-slate-800 text-white active:scale-90 transition">
        <span id="playPauseIcon">▶</span>
      </button>

      <button id="recordToggleBtn" class="flex items-center gap-2 bg-red-600 text-white font-semibold px-5 py-2.5 rounded-full text-sm shadow-lg shadow-red-600/40 active:scale-95 transition">
        <span id="recordDot" class="w-3 h-3 rounded-full bg-white"></span>
        <span id="recordLabel">Record</span>
      </button>

      <div class="flex items-center bg-slate-800 rounded-full px-2 py-1 border border-slate-700">
        <button id="speedMinus" class="text-slate-300 px-2 py-1 text-sm font-bold active:scale-90">-</button>
        <span id="currentSpeedLabel" class="text-xs font-semibold text-blue-400 px-1 min-w-[28px] text-center">2.0x</span>
        <button id="speedPlus" class="text-slate-300 px-2 py-1 text-sm font-bold active:scale-90">+</button>
      </div>
    </div>
  </div>

  <script>
    const setupView = document.getElementById('setupView');
    const prompterView = document.getElementById('prompterView');
    const scriptInput = document.getElementById('scriptInput');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const fontSlider = document.getElementById('fontSlider');
    const fontDisplay = document.getElementById('fontDisplay');
    const mirrorToggle = document.getElementById('mirrorToggle');
    const launchBtn = document.getElementById('launchBtn');
    const exitBtn = document.getElementById('exitBtn');
    const cameraPreview = document.getElementById('cameraPreview');
    const prompterScrollBox = document.getElementById('prompterScrollBox');
    const prompterContent = document.getElementById('prompterContent');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const recordToggleBtn = document.getElementById('recordToggleBtn');
    const recordLabel = document.getElementById('recordLabel');
    const recordDot = document.getElementById('recordDot');
    const recIndicator = document.getElementById('recIndicator');
    const recTimer = document.getElementById('recTimer');
    const currentSpeedLabel = document.getElementById('currentSpeedLabel');
    const speedMinus = document.getElementById('speedMinus');
    const speedPlus = document.getElementById('speedPlus');
    const downloadBanner = document.getElementById('downloadBanner');
    const downloadInfo = document.getElementById('downloadInfo');
    const downloadBtn = document.getElementById('downloadBtn');
    const topDownloadBtn = document.getElementById('topDownloadBtn');

    let stream = null;
    let isScrolling = false;
    let isRecording = false;
    let scrollSpeed = 2;
    let timerInterval = null;
    let recStartTime = 0;
    let activeStopHandler = null;
    let lastBlobUrl = null;

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const withTimeout = (promise, ms) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('Operation timed out')), ms))
    ]);

    speedSlider.addEventListener('input', (e) => {
      scrollSpeed = parseFloat(e.target.value);
      speedDisplay.textContent = `${scrollSpeed.toFixed(1)}x`;
      currentSpeedLabel.textContent = `${scrollSpeed.toFixed(1)}x`;
    });

    fontSlider.addEventListener('input', (e) => {
      fontDisplay.textContent = `${e.target.value}px`;
    });

    speedMinus.addEventListener('click', () => {
      scrollSpeed = Math.max(0.5, scrollSpeed - 0.5);
      speedSlider.value = scrollSpeed;
      speedDisplay.textContent = `${scrollSpeed.toFixed(1)}x`;
      currentSpeedLabel.textContent = `${scrollSpeed.toFixed(1)}x`;
    });

    speedPlus.addEventListener('click', () => {
      scrollSpeed = Math.min(6, scrollSpeed + 0.5);
      speedSlider.value = scrollSpeed;
      speedDisplay.textContent = `${scrollSpeed.toFixed(1)}x`;
      currentSpeedLabel.textContent = `${scrollSpeed.toFixed(1)}x`;
    });

    function scrollStep() {
      if (isScrolling && prompterScrollBox) {
        prompterScrollBox.scrollTop += scrollSpeed * 0.75;
      }
      requestAnimationFrame(scrollStep);
    }
    requestAnimationFrame(scrollStep);

    function formatDuration(ms) {
      const totalSec = Math.max(1, Math.round(ms / 1000));
      const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function startTimer() {
      recStartTime = performance.now();
      recTimer.textContent = '00:00';
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((performance.now() - recStartTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        recTimer.textContent = `${m}:${s}`;
      }, 250);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      return performance.now() - recStartTime;
    }

    function setRecordingUI(active) {
      if (active) {
        isRecording = true;
        isScrolling = true;
        playPauseIcon.textContent = '❚❚';
        recordLabel.textContent = 'Stop';
        recordToggleBtn.classList.replace('bg-red-600', 'bg-slate-200');
        recordToggleBtn.classList.replace('text-white', 'text-slate-950');
        recordDot.classList.replace('bg-white', 'bg-red-600');
        recordDot.classList.remove('rounded-full');
        recIndicator.classList.remove('hidden');
        topDownloadBtn.classList.add('hidden');
        startTimer();
      } else {
        isRecording = false;
        isScrolling = false;
        playPauseIcon.textContent = '▶';
        recordLabel.textContent = 'Record';
        recordToggleBtn.classList.replace('bg-slate-200', 'bg-red-600');
        recordToggleBtn.classList.replace('text-slate-950', 'text-white');
        recordDot.classList.replace('bg-red-600', 'bg-white');
        recordDot.classList.add('rounded-full');
        recIndicator.classList.add('hidden');
      }
    }

    function publishDownload(blob, ext, durationMs) {
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      const url = URL.createObjectURL(blob);
      lastBlobUrl = url;

      const formatted = formatDuration(durationMs);
      const filename = `teleprompter-${Date.now()}.${ext}`;

      downloadBtn.href = url;
      downloadBtn.download = filename;
      downloadBtn.textContent = `Save Video (.${ext})`;
      downloadInfo.textContent = `Recording ready (${formatted})!`;
      downloadBanner.classList.remove('hidden');

      topDownloadBtn.href = url;
      topDownloadBtn.download = filename;
      topDownloadBtn.textContent = `⬇ Save .${ext.toUpperCase()} (${formatted})`;
      topDownloadBtn.classList.remove('hidden');
    }

    // Normalizes AudioData to f32-planar with clean 0-based timestamps
    function normalizeAudioData(audioData, timestampUs) {
      const numChannels = audioData.numberOfChannels;
      const numFrames = audioData.numberOfFrames;
      const sampleRate = audioData.sampleRate;
      const buffer = new Float32Array(numFrames * numChannels);
      for (let ch = 0; ch < numChannels; ch++) {
        audioData.copyTo(buffer.subarray(ch * numFrames, (ch + 1) * numFrames), {
          planeIndex: ch,
          format: 'f32-planar'
        });
      }
      return new AudioData({
        format: 'f32-planar',
        sampleRate,
        numberOfFrames: numFrames,
        numberOfChannels: numChannels,
        timestamp: timestampUs,
        data: buffer
      });
    }

    // Patches mvhd, tkhd, mdhd, and mehd duration atoms in MediaRecorder MP4 blobs
    function patchMp4Duration(buffer, durationMs) {
      const view = new DataView(buffer);
      let mvhdTimescale = 1000;

      function walkBoxes(start, end) {
        let offset = start;
        while (offset + 8 <= end) {
          const size = view.getUint32(offset);
          if (size < 8 || offset + size > end) break;
          const type = String.fromCharCode(
            view.getUint8(offset + 4),
            view.getUint8(offset + 5),
            view.getUint8(offset + 6),
            view.getUint8(offset + 7)
          );
          const payload = offset + 8;

          if (type === 'moov' || type === 'trak' || type === 'mdia' || type === 'mvex') {
            walkBoxes(payload, offset + size);
          } else if (type === 'mvhd' && payload + 20 <= offset + size) {
            const v = view.getUint8(payload);
            if (v === 0) {
              mvhdTimescale = view.getUint32(payload + 12) || 1000;
              view.setUint32(payload + 16, Math.round((durationMs / 1000) * mvhdTimescale));
            } else if (v === 1 && payload + 32 <= offset + size) {
              mvhdTimescale = view.getUint32(payload + 20) || 1000;
              view.setBigUint64(payload + 24, BigInt(Math.round((durationMs / 1000) * mvhdTimescale)));
            }
          } else if (type === 'tkhd' && payload + 24 <= offset + size) {
            const v = view.getUint8(payload);
            if (v === 0) {
              view.setUint32(payload + 20, Math.round((durationMs / 1000) * mvhdTimescale));
            } else if (v === 1 && payload + 36 <= offset + size) {
              view.setBigUint64(payload + 28, BigInt(Math.round((durationMs / 1000) * mvhdTimescale)));
            }
          } else if (type === 'mdhd' && payload + 20 <= offset + size) {
            const v = view.getUint8(payload);
            if (v === 0) {
              const ts = view.getUint32(payload + 12) || 1000;
              view.setUint32(payload + 16, Math.round((durationMs / 1000) * ts));
            } else if (v === 1 && payload + 32 <= offset + size) {
              const ts = view.getUint32(payload + 20) || 1000;
              view.setBigUint64(payload + 24, BigInt(Math.round((durationMs / 1000) * ts)));
            }
          } else if (type === 'mehd' && payload + 8 <= offset + size) {
            const v = view.getUint8(payload);
            if (v === 0) {
              view.setUint32(payload + 4, Math.round((durationMs / 1000) * mvhdTimescale));
            } else if (v === 1 && payload + 12 <= offset + size) {
              view.setBigUint64(payload + 4, BigInt(Math.round((durationMs / 1000) * mvhdTimescale)));
            }
          }
          offset += size;
        }
      }

      try {
        walkBoxes(0, buffer.byteLength);
      } catch (e) {
        console.warn('MP4 header patch skipped:', e);
      }
      return buffer;
    }

    // Primary Recorder: Canvas-backed WebCodecs + Mp4Muxer
    async function startWebCodecsMp4Recorder(mediaStream) {
      if (
        typeof Mp4Muxer === 'undefined' ||
        typeof VideoEncoder === 'undefined' ||
        typeof AudioEncoder === 'undefined' ||
        typeof MediaStreamTrackProcessor === 'undefined'
      ) {
        throw new Error('WebCodecs unavailable');
      }

      const origVideoTrack = mediaStream.getVideoTracks()[0];
      const origAudioTrack = mediaStream.getAudioTracks()[0];
      if (!origVideoTrack || !origAudioTrack) throw new Error('Missing audio or video track');

      const recVideoTrack = origVideoTrack.clone();
      const recAudioTrack = origAudioTrack.clone();

      let firstFrame = null;
      let firstAudio = null;

      try {
        const videoReader = new MediaStreamTrackProcessor({ track: recVideoTrack }).readable.getReader();
        const audioReader = new MediaStreamTrackProcessor({ track: recAudioTrack }).readable.getReader();

        const [firstVidRes, firstAudRes] = await withTimeout(
          Promise.all([videoReader.read(), audioReader.read()]),
          2500
        );

        if (firstVidRes.done || firstAudRes.done || !firstVidRes.value || !firstAudRes.value) {
          throw new Error('Initial frame read failed');
        }

        firstFrame = firstVidRes.value;
        firstAudio = firstAudRes.value;

        const rawW = firstFrame.codedWidth || 720;
        const rawH = firstFrame.codedHeight || 1280;
        const width = Math.max(16, Math.floor(rawW / 16) * 16);
        const height = Math.max(16, Math.floor(rawH / 16) * 16);

        // Always draw onto a 2D canvas to convert Android AHardwareBuffer textures into RGBA frames
        const frameCanvas = document.createElement('canvas');
        frameCanvas.width = width;
        frameCanvas.height = height;
        const frameCtx = frameCanvas.getContext('2d', { alpha: false });

        const toCanvasVideoFrame = (rawFrame, timestampUs) => {
          frameCtx.drawImage(rawFrame, 0, 0, width, height);
          rawFrame.close();
          return new VideoFrame(frameCanvas, { timestamp: timestampUs });
        };

        const sampleRate = firstAudio.sampleRate || 48000;
        const numberOfChannels = firstAudio.numberOfChannels || 1;

        const codecCandidates = [
          { codec: 'avc1.42001f', hardwareAcceleration: 'no-preference' },
          { codec: 'avc1.42002a', hardwareAcceleration: 'no-preference' },
          { codec: 'avc1.4d002a', hardwareAcceleration: 'no-preference' },
          { codec: 'avc1.42001f', hardwareAcceleration: 'prefer-software' }
        ];

        let chosenConfig = null;
        for (const cand of codecCandidates) {
          const support = await VideoEncoder.isConfigSupported({
            ...cand,
            width,
            height,
            bitrate: 2_500_000,
            framerate: 30
          });
          if (support.supported) {
            chosenConfig = cand;
            break;
          }
        }

        const aacSupport = await AudioEncoder.isConfigSupported({
          codec: 'mp4a.40.2',
          numberOfChannels,
          sampleRate,
          bitrate: 128_000
        });

        if (!chosenConfig || !aacSupport.supported) {
          throw new Error('H.264 or AAC WebCodecs config unsupported');
        }

        let encoderFailed = false;
        let lastEncoderError = null;
        let encodedVideoChunks = 0;

        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width, height },
          audio: { codec: 'aac', numberOfChannels, sampleRate },
          fastStart: 'in-memory',
          firstTimestampBehavior: 'offset'
        });

        const videoEncoder = new VideoEncoder({
          output: (chunk, meta) => {
            encodedVideoChunks++;
            muxer.addVideoChunk(chunk, meta);
          },
          error: (e) => {
            console.error('VideoEncoder error:', e);
            encoderFailed = true;
            lastEncoderError = e;
          }
        });
        videoEncoder.configure({
          ...chosenConfig,
          width,
          height,
          bitrate: 2_500_000,
          framerate: 30
        });

        const audioEncoder = new AudioEncoder({
          output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
          error: (e) => {
            console.error('AudioEncoder error:', e);
            encoderFailed = true;
            lastEncoderError = e;
          }
        });
        audioEncoder.configure({
          codec: 'mp4a.40.2',
          numberOfChannels,
          sampleRate,
          bitrate: 128_000
        });

        // Encode initial frame and audio packet at timestamp 0 to verify encoder health before starting UI
        const basePerfMs = performance.now();
        let lastVideoTsUs = 0;
        let totalAudioSamples = 0;

        const initVidFrame = toCanvasVideoFrame(firstFrame, 0);
        firstFrame = null;
        videoEncoder.encode(initVidFrame, { keyFrame: true });
        initVidFrame.close();

        const initAudioData = normalizeAudioData(firstAudio, 0);
        totalAudioSamples += firstAudio.numberOfFrames;
        firstAudio.close();
        firstAudio = null;
        audioEncoder.encode(initAudioData);
        initAudioData.close();

        await sleep(60);
        if (encoderFailed) {
          if (videoEncoder.state !== 'closed') videoEncoder.close();
          if (audioEncoder.state !== 'closed') audioEncoder.close();
          throw lastEncoderError || new Error('Encoder rejected initial frame');
        }

        setRecordingUI(true);
        let videoFrameCount = 1;

        const pumpVideo = (async () => {
          try {
            while (isRecording && !encoderFailed) {
              const { value: frame, done } = await videoReader.read();
              if (done || !frame) break;
              if (!isRecording || encoderFailed || videoEncoder.state !== 'configured') {
                frame.close();
                break;
              }
              let tsUs = Math.max(0, Math.round((performance.now() - basePerfMs) * 1000));
              if (tsUs <= lastVideoTsUs) tsUs = lastVideoTsUs + 1000;
              lastVideoTsUs = tsUs;

              const cleanFrame = toCanvasVideoFrame(frame, tsUs);
              videoEncoder.encode(cleanFrame, { keyFrame: videoFrameCount % 60 === 0 });
              cleanFrame.close();
              videoFrameCount++;
            }
          } catch (_) {}
        })();

        const pumpAudio = (async () => {
          try {
            while (isRecording && !encoderFailed) {
              const { value: data, done } = await audioReader.read();
              if (done || !data) break;
              if (!isRecording || encoderFailed || audioEncoder.state !== 'configured') {
                data.close();
                break;
              }
              const audioTsUs = Math.round((totalAudioSamples / sampleRate) * 1_000_000);
              totalAudioSamples += data.numberOfFrames;

              const cleanAudio = normalizeAudioData(data, audioTsUs);
              data.close();
              audioEncoder.encode(cleanAudio);
              cleanAudio.close();
            }
          } catch (_) {}
        })();

        activeStopHandler = async () => {
          const durationMs = stopTimer();
          setRecordingUI(false);
          recordToggleBtn.disabled = true;
          recordLabel.textContent = 'Saving...';

          try {
            recVideoTrack.stop();
            recAudioTrack.stop();

            await Promise.race([
              Promise.allSettled([pumpVideo, pumpAudio]),
              sleep(1200)
            ]);

            if (!encoderFailed) {
              if (videoEncoder.state === 'configured') {
                await Promise.race([videoEncoder.flush(), sleep(2000)]);
              }
              if (audioEncoder.state === 'configured') {
                await Promise.race([audioEncoder.flush(), sleep(1500)]);
              }
            }

            if (videoEncoder.state !== 'closed') videoEncoder.close();
            if (audioEncoder.state !== 'closed') audioEncoder.close();

            if (encodedVideoChunks === 0) {
              throw new Error('No video chunks encoded');
            }

            muxer.finalize();
            const buffer = muxer.target.buffer;
            const blob = new Blob([buffer], { type: 'video/mp4' });
            publishDownload(blob, 'mp4', durationMs);
          } catch (err) {
            console.error('Stop finalization error:', err);
            alert('Unable to finalize video file: ' + (err?.message || 'Encoder error'));
          } finally {
            recordToggleBtn.disabled = false;
            recordLabel.textContent = 'Record';
          }
        };
      } catch (setupErr) {
        if (firstFrame) firstFrame.close();
        if (firstAudio) firstAudio.close();
        recVideoTrack.stop();
        recAudioTrack.stop();
        throw setupErr;
      }
    }

    // Fallback Recorder: Single-cluster MediaRecorder with full MP4 duration header patching
    function startFallbackRecorder(mediaStream) {
      const preferredTypes = [
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      const selectedMimeType = preferredTypes.find((t) => MediaRecorder.isTypeSupported(t)) || '';
      const chunks = [];
      const recorder = new MediaRecorder(mediaStream, selectedMimeType ? { mimeType: selectedMimeType } : undefined);

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      setRecordingUI(true);
      recorder.start();

      activeStopHandler = async () => {
        const durationMs = stopTimer();
        setRecordingUI(false);
        recordToggleBtn.disabled = true;
        recordLabel.textContent = 'Saving...';

        try {
          await new Promise((resolve) => {
            recorder.onstop = resolve;
            recorder.stop();
          });

          const finalMime = recorder.mimeType || selectedMimeType || 'video/mp4';
          const isMp4 = finalMime.includes('mp4');
          const ext = isMp4 ? 'mp4' : 'webm';
          let rawBlob = new Blob(chunks, { type: finalMime });

          if (isMp4) {
            const buf = await rawBlob.arrayBuffer();
            patchMp4Duration(buf, durationMs);
            rawBlob = new Blob([buf], { type: 'video/mp4' });
          }

          publishDownload(rawBlob, ext, durationMs);
        } finally {
          recordToggleBtn.disabled = false;
          recordLabel.textContent = 'Record';
        }
      };
    }

    launchBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        cameraPreview.srcObject = stream;
        await cameraPreview.play();

        prompterContent.textContent = scriptInput.value;
        prompterContent.style.fontSize = `${fontSlider.value}px`;
        prompterScrollBox.style.transform = mirrorToggle.checked ? 'scaleX(-1)' : 'none';
        prompterScrollBox.scrollTop = 0;

        setupView.classList.add('hidden');
        prompterView.classList.remove('hidden');
      } catch (err) {
        alert("Camera and microphone permissions are required to launch the prompter.");
      }
    });

    playPauseBtn.addEventListener('click', () => {
      isScrolling = !isScrolling;
      playPauseIcon.textContent = isScrolling ? '❚❚' : '▶';
    });

    recordToggleBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          await startWebCodecsMp4Recorder(stream);
        } catch (err) {
          console.warn('Using fallback recorder:', err);
          startFallbackRecorder(stream);
        }
      } else if (activeStopHandler) {
        const stopFn = activeStopHandler;
        activeStopHandler = null;
        await stopFn();
      }
    });

    exitBtn.addEventListener('click', async () => {
      if (isRecording && activeStopHandler) {
        const stopFn = activeStopHandler;
        activeStopHandler = null;
        await stopFn();
      }
      isScrolling = false;
      playPauseIcon.textContent = '▶';
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      prompterView.classList.add('hidden');
      setupView.classList.remove('hidden');
    });
  </script>
</body>
</html>
